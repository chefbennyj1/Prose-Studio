<!-- BACKGROUND SCENE -->
<div class="scene">
    <div class="scene__blob scene__blob--1"></div>
    <div class="scene__blob scene__blob--2"></div>
    <div class="scene__blob scene__blob--3"></div>
</div>

<!-- TOAST NOTIFICATIONS -->
<div id="toast-region" class="glass-toast-region"></div>

<!-- TOPBAR NAVIGATION -->
<header class="topbar glass glass--frosted">
    <div class="topbar-left" style="gap: 40px;">
        <div class="logo">SEQUENTIAL</div>
        <div class="glass-tabs">
            <nav class="glass-tab-list" id="main-navigation" role="tablist" aria-label="Main navigation">
                <button class="glass-tab" role="tab" aria-selected="true" data-page="studio" tabindex="0">Studio</button>
                <button class="glass-tab" role="tab" aria-selected="false" data-page="scheduled-tasks" tabindex="-1">Scanner</button>
                <button class="glass-tab" role="tab" aria-selected="false" data-page="library-settings" tabindex="-1">Settings</button>
                <button class="glass-tab" role="tab" aria-selected="false" data-page="accounts" tabindex="-1">Accounts</button>
                <div class="divider-v" style="height: 20px; margin: 0 10px;"></div>
                <a href="/library" class="glass-tab" style="text-decoration: none; display: inline-flex; align-items: center; gap: 5px;" title="Go to Library">
                    <ion-icon name="library-outline"></ion-icon> Library
                </a>
            </nav>
        </div>
    </div>

    <div class="topbar-right" style="gap: 25px;">

        <!-- Notification bell (populated by GlassNotifications) -->
        <div id="notificationBell" class="glass-notifications"></div>

        <div class="user-profile" id="userProfileToggle" style="display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative;">
            <span id="user-name" class="font-weight-bold" style="font-size: var(--text-sm); opacity: 0.8;"></span>
            <img src="/views/public/images/avatar.png" alt="Profile" class="avatar" />
            <div class="glass glass--dark dropdown" id="userMenu">
                <button type="button" id="accountSettingsBtn" class="glass-dropdown-item">Account Settings</button>
                <button type="button" id="restartServerBtn" class="glass-dropdown-item hidden">Restart Server</button>
                <button type="button" id="shutdownServerBtn" class="glass-dropdown-item hidden">Shut Down Server</button>
                <form action="/authentication/logout" method="POST">
                    <button type="submit" id="logoutBtn" class="glass-dropdown-item">Logout</button>
                </form>
            </div>
        </div>
    </div>
</header>

<!-- APP BODY: persistent studio tool rail + section mount point -->
<div class="app-body">
    <nav id="studioRail" class="studio-rail glass glass--frosted" aria-label="Studio tools">
        <!--
            Story and Chapter are menus, not destinations, which is why they
            carry data-menu rather than data-target: nothing here navigates to
            a section on its own. One click shows "Create New" and the list of
            what already exists. Story sits at the top because it is the widest
            thing you can pick - everything below is inside whatever it names.

            The list used to sit behind an "Open" row that flew out sideways.
            That row revealed its flyout on mouseenter and the click that
            followed closed it again, so the menu could not be opened by
            clicking at all. The level is gone rather than patched.

            "Create New" stays a .glass-dropdown-item so the kit's own handler
            closes the menu on click.
        -->
        <div class="rail-menu" data-menu="story">
            <button type="button" id="storyMenuBtn"
                class="studio-rail__btn rail-menu__trigger"
                title="Story" aria-label="Story" aria-haspopup="menu">
                <ion-icon name="book-outline"></ion-icon>
            </button>
            <div class="glass-dropdown-menu glass glass--frosted" role="menu">
                <button type="button" class="glass-dropdown-item" data-action="create"
                    data-target="create-story" role="menuitem">
                    Create New
                </button>
                <div class="rail-menu__divider" role="separator"></div>
                <div class="rail-menu__list" data-list="story" role="group"
                    aria-label="Stories"></div>
            </div>
        </div>

        <div class="rail-menu" data-menu="chapter">
            <button type="button" id="chapterMenuBtn"
                class="studio-rail__btn rail-menu__trigger"
                title="Chapter" aria-label="Chapter" aria-haspopup="menu">
                <ion-icon name="bookmarks-outline"></ion-icon>
            </button>
            <div class="glass-dropdown-menu glass glass--frosted" role="menu">
                <button type="button" class="glass-dropdown-item" data-action="create"
                    data-target="create-chapter" role="menuitem">
                    Create New
                </button>
                <div class="rail-menu__divider" role="separator"></div>
                <div class="rail-menu__list" data-list="chapter" role="group"
                    aria-label="Chapters"></div>
            </div>
        </div>

        <div class="studio-rail__divider" role="separator"></div>

        <!-- Daily workspaces -->
        <button type="button" class="studio-rail__btn" data-target="editor"
            title="Editor" aria-label="Editor">
            <ion-icon name="create-outline"></ion-icon>
        </button>
        <button type="button" class="studio-rail__btn" data-target="characters"
            title="Character Lab" aria-label="Character Lab">
            <ion-icon name="people-outline"></ion-icon>
        </button>
        <button type="button" class="studio-rail__btn" data-target="plot-lab"
            title="Plot Lab" aria-label="Plot Lab">
            <ion-icon name="bulb-outline"></ion-icon>
        </button>
        <!-- Words the checker should accept and how the narrator says them -
             one list, because they are very nearly the same words. -->
        <button type="button" class="studio-rail__btn" data-target="dictionary"
            title="Dictionary" aria-label="Dictionary">
            <ion-icon name="book"></ion-icon>
        </button>

        <!-- Back up to GitHub is in the editor's bar beside Save, not here.
             It is a document action rather than a tool, and among the rail's
             icons it was hard to find. -->

        <div class="studio-rail__divider" role="separator"></div>

        <!--
            REVIEW.

            The four checks, in the order of what they cost to run, which is
            also the order you want them in: mechanics and spelling are regex
            and a dictionary and answer in milliseconds, line edits and
            critique wake the local model and take minutes. The badge carries
            the last count back so the rail can say there is something to read
            without the drawer having to stay open.

            This whole menu came out of the editor's right-hand panel. Those
            were controls sitting in a writing surface, and the two selects in
            particular - lens and engine - were settings dressed as part of the
            page. The panel shows what was found; choosing what to look for
            belongs with the navigation.
        -->
        <div class="rail-menu rail-menu--up" data-menu="review">
            <button type="button" id="reviewMenuBtn"
                class="studio-rail__btn rail-menu__trigger"
                title="Review" aria-label="Review" aria-haspopup="menu">
                <ion-icon name="search-outline"></ion-icon>
                <span class="studio-rail__badge hidden" id="reviewBadge"></span>
            </button>
            <div class="glass-dropdown-menu glass glass--frosted" role="menu">
                <!-- These four do not stopPropagation: the click is meant to
                     reach the document handler that closes the menu, because
                     each one starts something and there is nothing left to
                     choose here afterwards. -->
                <button type="button" class="rail-menu__item rail-menu__action"
                    data-review="mechanics" role="menuitem">
                    <ion-icon name="construct-outline" aria-hidden="true"></ion-icon>
                    <span class="rail-menu__label">Grammar &amp; mechanics</span>
                    <span class="rail-menu__hint">instant</span>
                </button>
                <button type="button" class="rail-menu__item rail-menu__action"
                    data-review="spelling" role="menuitem">
                    <ion-icon name="text-outline" aria-hidden="true"></ion-icon>
                    <span class="rail-menu__label">Spelling</span>
                    <span class="rail-menu__hint">instant</span>
                </button>
                <!--
                    These two are the AI, and data-needs-ai is what hides them.
                    The AI is opt-in: until it is switched on in Settings with a
                    key, these rows are not in the menu at all, rather than
                    being offered and then failing. Everything above them is
                    local and always here, which is what makes the opt-in real.

                    They are also the only two things in the editor that send
                    text off this machine, and the hint says so.
                -->
                <button type="button" class="rail-menu__item rail-menu__action hidden"
                    data-review="edits" data-needs-ai role="menuitem">
                    <ion-icon name="color-wand-outline" aria-hidden="true"></ion-icon>
                    <span class="rail-menu__label">Line edits</span>
                    <span class="rail-menu__hint">Gemini</span>
                </button>
                <button type="button" class="rail-menu__item rail-menu__action hidden"
                    data-review="critique" data-needs-ai role="menuitem">
                    <ion-icon name="glasses-outline" aria-hidden="true"></ion-icon>
                    <span class="rail-menu__label">Critique</span>
                    <span class="rail-menu__hint">Gemini</span>
                </button>

                <div class="rail-menu__divider" role="separator"></div>

                <!-- No data-list on any of these: their contents belong to
                     ReviewMenu.js, so they open on click and stay open, the
                     same contract the Narrator menu's submenus use. -->
                <!-- Also AI-only: the lens picks what Critique looks for, and
                     with the AI off there is no Critique to aim. -->
                <div class="rail-menu__submenu hidden" data-review-menu="lens" data-needs-ai>
                    <button type="button" class="rail-menu__item rail-menu__item--parent"
                        data-action="open" role="menuitem" aria-haspopup="menu" aria-expanded="false">
                        <span class="rail-menu__label">Critic lens</span>
                        <span class="rail-menu__value" id="reviewLensValue"></span>
                        <span class="rail-menu__chevron" aria-hidden="true">&rsaquo;</span>
                    </button>
                    <div class="rail-menu__flyout glass glass--frosted"
                        id="reviewLensFlyout" role="menu"></div>
                </div>

                <!-- The engine picker stood here. There was a choice to make
                     when a local Gemma and Gemini both answered; there is one
                     engine now, so the row was a menu with a single option. -->

                <!-- Which mechanics rules run. Fiction breaks grammar on
                     purpose, so a writer whose voice lives in fragments needs
                     to be able to switch that one rule off rather than learn
                     to ignore the whole panel. -->
                <div class="rail-menu__submenu" data-review-menu="rules">
                    <button type="button" class="rail-menu__item rail-menu__item--parent"
                        data-action="open" role="menuitem" aria-haspopup="menu" aria-expanded="false">
                        <span class="rail-menu__label">Mechanics rules</span>
                        <span class="rail-menu__value" id="reviewRulesValue"></span>
                        <span class="rail-menu__chevron" aria-hidden="true">&rsaquo;</span>
                    </button>
                    <div class="rail-menu__flyout rail-menu__flyout--tall glass glass--frosted"
                        id="reviewRulesFlyout" role="menu"></div>
                </div>
            </div>
        </div>

        <!--
            Configuration.

            Narrator is a menu rather than a destination for the same reason
            Story and Chapter are: there is nothing to navigate to. Its three
            rows came out of the editor's panel, where they were settings
            sitting in the middle of a writing surface.

            None of its submenus carry data-list, which is what tells RailMenu
            that their contents belong to NarratorMenu.js and that they open on
            click and stay open. The pronunciation one holds a form; a flyout
            that closed when the pointer left the row could never be typed in.
        -->
        <div class="rail-menu rail-menu--up" data-menu="narrator">
            <button type="button" id="narratorMenuBtn"
                class="studio-rail__btn rail-menu__trigger"
                title="Narrator" aria-label="Narrator" aria-haspopup="menu">
                <ion-icon name="headset-outline"></ion-icon>
            </button>
            <div class="glass-dropdown-menu glass glass--frosted" role="menu">
                <!-- Piper, on this machine. One voice: it reads a paragraph
                     back and it renders the finished chapter, because local
                     synthesis costs nothing to run twice. -->
                <div class="rail-menu__submenu" data-narrator="voice">
                    <button type="button" class="rail-menu__item rail-menu__item--parent"
                        data-action="open" role="menuitem" aria-haspopup="menu" aria-expanded="false">
                        <span class="rail-menu__label">Voice</span>
                        <span class="rail-menu__value" id="narratorVoiceValue"></span>
                        <span class="rail-menu__chevron" aria-hidden="true">&rsaquo;</span>
                    </button>
                    <div class="rail-menu__flyout glass glass--frosted"
                        id="narratorVoiceFlyout" role="menu"></div>
                </div>

                <!-- Only shown for voices that carry more than one person.
                     VCTK holds 109 and LibriTTS 904, all in a single file and
                     reachable only by id - so without this row every render
                     used speaker 0, chosen by nothing but its position. -->
                <div class="rail-menu__submenu hidden" data-narrator="speaker">
                    <button type="button" class="rail-menu__item rail-menu__item--parent"
                        data-action="open" role="menuitem" aria-haspopup="menu" aria-expanded="false">
                        <span class="rail-menu__label">Speaker</span>
                        <span class="rail-menu__value" id="narratorSpeakerValue"></span>
                        <span class="rail-menu__chevron" aria-hidden="true">&rsaquo;</span>
                    </button>
                    <div class="rail-menu__flyout glass glass--frosted"
                        id="narratorSpeakerFlyout" role="menu"></div>
                </div>

                <!-- Layered at playback, never mixed into the rendered files:
                     the track is not part of the narration and must not be
                     part of its cache. -->
                <div class="rail-menu__submenu" data-narrator="music">
                    <button type="button" class="rail-menu__item rail-menu__item--parent"
                        data-action="open" role="menuitem" aria-haspopup="menu" aria-expanded="false">
                        <span class="rail-menu__label">Music</span>
                        <span class="rail-menu__value" id="narratorMusicValue"></span>
                        <span class="rail-menu__chevron" aria-hidden="true">&rsaquo;</span>
                    </button>
                    <div class="rail-menu__flyout glass glass--frosted"
                        id="narratorMusicFlyout" role="menu"></div>
                </div>

                <!--
                    Reading pace. Piper's own trained pace reads a novel at
                    about 220 words a minute, which is well past the 150-160
                    of audiobook narration and is heard as rushed. Shown in
                    wpm rather than as the length_scale it really is, because
                    nobody thinks in length_scale.
                -->
                <div class="rail-menu__item rail-menu__stepper">
                    <span class="rail-menu__label">Pace</span>
                    <button type="button" id="narratorSlowerBtn" class="rail-menu__step"
                        aria-label="Slower">&minus;</button>
                    <span class="rail-menu__value" id="narratorPaceValue"></span>
                    <button type="button" id="narratorFasterBtn" class="rail-menu__step"
                        aria-label="Faster">+</button>
                    <!-- A number cannot be judged by reading it. This speaks a
                         sample line at whatever the pace currently is. -->
                    <button type="button" id="narratorPaceTestBtn" class="rail-menu__step"
                        title="Hear this pace" aria-label="Hear this pace">
                        <ion-icon name="play"></ion-icon>
                    </button>
                </div>

                <!-- Off by default. Rendering is local and cheap, but a writer
                     who never listens should not have their machine
                     synthesising every paragraph they touch. -->
                <button type="button" id="narratorOnSaveBtn" class="rail-menu__item rail-menu__toggle"
                    role="menuitemcheckbox" aria-checked="false">
                    <span class="rail-menu__label">Render on save</span>
                    <span class="rail-menu__switch" aria-hidden="true"></span>
                </button>

                <div class="rail-menu__divider" role="separator"></div>

            </div>
        </div>

        <button type="button" class="studio-rail__btn" data-target="library-settings"
            title="File &amp; AI Settings" aria-label="File and AI Settings">
            <ion-icon name="settings-outline"></ion-icon>
        </button>
    </nav>

    <!-- MAIN CONTENT MOUNT POINT — sections are injected here dynamically -->
    <main id="main-content" class="main-content"></main>
</div>
