    <div class="editor dashboard-section hidden glass glass--frosted glass-card">
        <div class="editor__bar">
            <div class="flex-row-center gap-15">
                <h3 class="margin-0">Editor</h3>
                <!-- Not a control. Choosing what to open lives in the studio
                     rail's Story and Chapter menus; this only says what is
                     open, which is the one thing removing the pickers would
                     otherwise have left nowhere to read. -->
                <span id="editorWhere" class="editor__where">nothing open</span>
            </div>

            <div class="flex-row-center gap-15">
                <span id="editorPageCount" class="editor__count" title="Standard manuscript pages, 250 words each">0 pages</span>
                <span id="editorWordCount" class="editor__count">0 words</span>
                <span id="editorSaveState" class="editor__state">saved</span>
                <!--
                    The button carries the state itself: a floppy disk when
                    there is something to save, a green tick when there is not.
                    The line beside it stays, because it says the things a
                    two-state icon cannot - autosaving, conflict, no story
                    folder, and the error text when a save fails.
                -->
                <button id="editorSaveBtn" class="glass glass-btn glass-btn--primary is-saved">
                    <ion-icon name="checkmark-circle" id="editorSaveIcon"></ion-icon>
                    <span id="editorSaveLabel">Saved</span>
                </button>
            </div>
        </div>

        <div class="editor__body">
            <div class="editor__main">
                <!--
                    CodeMirror is created here by Surface.js, which also owns the
                    line numbers and the attributes that used to sit on the old
                    textarea: spellcheck stays on (the browser's checker is local,
                    instant and free), while autocorrect and autocapitalize stay
                    off because they mangle dialect, deliberate fragments and
                    invented names - all load-bearing in fiction. lang picks the
                    dictionary and is the same attribute `hyphens: auto` needs at
                    export time.
                -->
                <div id="editorSurface" class="editor__page"></div>
            </div>

            <!--
                THE DRAWER.

                Output only. Every control that used to be here - the lens and
                engine pickers, Spelling, Scan page, Critique - is in the studio
                rail's Review menu now, with the rest of the navigation.

                It is hidden until something has been found, and closes on the
                X, because 340px is a quarter of the writing width and an empty
                panel is not worth it. The editor opens it.
            -->
            <aside id="editorPanel" class="editor__panel" hidden>
                <div class="editor__panel-bar">
                    <h4 id="editorPanelTitle" class="editor__panel-title">Findings</h4>
                    <button type="button" id="editorPanelClose" class="editor__panel-close"
                        title="Close" aria-label="Close findings">
                        <ion-icon name="close"></ion-icon>
                    </button>
                </div>
                <div id="editorOutput" class="editor__output"></div>
            </aside>

            <!--
            THE PLAYER.

            A direct child of .editor__body and positioned against it, NOT
            against .editor__main. Anchored to .editor__main it inherited that
            nested flex column's height, and whenever the flex algorithm ran
            the column past the card the player went with it and had its
            bottom clipped away. .editor__body is exactly the content area, so
            it cannot drift like that, and clearing the drawer is the drawer's
            own width rather than that plus whatever padding the card carries.

            It is absolutely positioned, so it takes no part in the flex row it
            sits in and does not narrow the writing column.

            Every setting the narrator has - voice, speaker, pace, music,
            render-on-save - is in the rail's Narrator menu, because settings
            are chosen once and left alone. These are not settings. Pausing is
            something you do while listening, and a control that lives inside a
            dropdown which closes when you touch it costs two clicks every
            single time.

            Render is deliberately explicit rather than automatic. It is the
            writer saying "this draft is worth hearing", and the status line
            says what that will cost before they commit - paragraphs already
            done are reused. Re-render distrusts the files and rebuilds the
            whole chapter, for audio that is wrong for a reason the text hash
            cannot see.
        -->
        <div class="editor__transport">
            <!--
                Transport icons, not words. play-skip-* are the track-skip
                glyphs rather than the seek ones, which is what these do: they
                move a whole paragraph, they do not scrub.

                The play button keeps its label as well as its icon. It is the
                primary action and it is the one control here whose meaning
                changes as you use it, so it says which state it is about to
                put you in.

                Keeps narrator__transport so the button, icon and
                speaking-state styling in Narrator.css still applies; only the
                layout differs now that this is a floating player rather than a
                narrow column.
            -->
            <div class="editor__transport-row narrator__transport">
                <button type="button" id="narratorPrevBtn" class="glass glass-btn glass-btn--icon"
                    title="Previous paragraph" aria-label="Previous paragraph" disabled>
                    <ion-icon name="play-skip-back"></ion-icon>
                </button>
                <button type="button" id="narratorPlayBtn" class="glass glass-btn glass-btn--primary"
                    disabled>
                    <ion-icon name="play" id="narratorPlayIcon"></ion-icon>
                    <span id="narratorPlayLabel">Listen</span>
                </button>
                <button type="button" id="narratorNextBtn" class="glass glass-btn glass-btn--icon"
                    title="Next paragraph" aria-label="Next paragraph" disabled>
                    <ion-icon name="play-skip-forward"></ion-icon>
                </button>

                <div class="editor__transport-spacer"></div>

                <button type="button" id="narratorRenderBtn"
                    class="glass glass-btn glass-btn--sm">Render</button>
                <button type="button" id="narratorRerenderBtn"
                    class="glass glass-btn glass-btn--icon"
                    title="Rebuild every paragraph" aria-label="Re-render whole chapter">
                    <ion-icon name="refresh"></ion-icon>
                </button>
            </div>

            <div id="narratorStatus" class="narrator__status"></div>
            <div class="narrator__progress hidden" id="narratorProgress">
                <div class="narrator__progress-bar" id="narratorProgressBar"></div>
            </div>
            </div>
        </div>

    </div>
