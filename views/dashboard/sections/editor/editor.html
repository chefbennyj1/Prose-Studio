    <div class="editor dashboard-section hidden glass glass--frosted glass-card">
        <div class="editor__bar">
            <div class="flex-row-center gap-15">
                <h3 class="margin-0">Editor</h3>
                <!-- Not a control. Choosing what to open lives in the studio
                     rail's Story and Chapter menus; this only says what is
                     open, which is the one thing removing the pickers would
                     otherwise have left nowhere to read. -->
                <span id="editorWhere" class="editor__where">nothing open</span>
            </div>

            <div class="flex-row-center gap-15">
                <span id="editorPageCount" class="editor__count" title="Standard manuscript pages, 250 words each">0 pages</span>
                <span id="editorWordCount" class="editor__count">0 words</span>
                <span id="editorSaveState" class="editor__state">saved</span>
                <button id="editorSaveBtn" class="glass glass-btn glass-btn--primary">Save</button>
            </div>
        </div>

        <div class="editor__body">
            <!--
                CodeMirror is created here by Surface.js, which also owns the
                line numbers and the attributes that used to sit on the old
                textarea: spellcheck stays on (the browser's checker is local,
                instant and free), while autocorrect and autocapitalize stay
                off because they mangle dialect, deliberate fragments and
                invented names - all load-bearing in fiction. lang picks the
                dictionary and is the same attribute `hyphens: auto` needs at
                export time.
            -->
            <div id="editorSurface" class="editor__page"></div>

            <aside id="editorPanel" class="editor__panel">
                <!--
                    Listening back, as a transport, not an analysis tool - so
                    it sits above the critic's row rather than beside it.

                    The voice picker and the pronunciation editor that used to
                    be here are in the studio rail's Narrator menu now. Those
                    are settings; these are controls.

                    Render is deliberately explicit rather than automatic. It
                    is the writer saying "this draft is worth hearing", and the
                    line under it says what that will cost in work before they
                    commit - paragraphs already done are reused.
                -->
                <div class="narrator__panel">
                <!--
                    Transport icons, not words. play-skip-* are the track-skip
                    glyphs rather than the seek ones, which is what these do:
                    they move a whole paragraph, they do not scrub.

                    The play button keeps its label as well as its icon. It is
                    the primary action and it is the one control here whose
                    meaning changes as you use it, so it says which state it is
                    about to put you in.
                -->
                    <div class="narrator__transport">
                        <button type="button" id="narratorPrevBtn" class="glass glass-btn glass-btn--icon"
                            title="Previous paragraph" aria-label="Previous paragraph" disabled>
                            <ion-icon name="play-skip-back"></ion-icon>
                        </button>
                        <button type="button" id="narratorPlayBtn" class="glass glass-btn glass-btn--primary"
                            disabled>
                            <ion-icon name="play" id="narratorPlayIcon"></ion-icon>
                            <span id="narratorPlayLabel">Listen</span>
                        </button>
                        <button type="button" id="narratorNextBtn" class="glass glass-btn glass-btn--icon"
                            title="Next paragraph" aria-label="Next paragraph" disabled>
                            <ion-icon name="play-skip-forward"></ion-icon>
                        </button>

                        <!--
                            Render does the paragraphs that changed, and says
                            so when there are none.

                            It is NOT made redundant by render-on-save. That is
                            off by default and, when on, waits eight seconds
                            after a save and skips entirely while you are
                            listening - so there is always a state where the
                            audio is behind the text and you want it caught up
                            now rather than eventually. This is that button,
                            and it is the only way to render at all with the
                            setting off.

                            Re-render distrusts the files and rebuilds the
                            whole chapter, for audio that is wrong for a reason
                            the text hash cannot see.
                        -->
                        <button type="button" id="narratorRenderBtn"
                            class="glass glass-btn glass-btn--sm">Render</button>
                        <button type="button" id="narratorRerenderBtn"
                            class="glass glass-btn glass-btn--icon"
                            title="Rebuild every paragraph" aria-label="Re-render whole chapter">
                            <ion-icon name="refresh"></ion-icon>
                        </button>
                    </div>
                    <div id="narratorStatus" class="narrator__status"></div>
                    <div class="narrator__progress hidden" id="narratorProgress">
                        <div class="narrator__progress-bar" id="narratorProgressBar"></div>
                    </div>
                </div>

                <div class="editor__panel-head">
                    <select id="editorLensSelect" class="glass-select" title="What the critic looks for"></select>
                    <select id="editorEngineSelect" class="glass-select" title="Which model answers"></select>
                </div>
                <div class="editor__panel-actions">
                    <button id="editorSpellBtn" class="glass glass-btn">Spelling</button>
                    <button id="editorScanBtn" class="glass glass-btn">Scan page</button>
                    <button id="editorCritiqueBtn" class="glass glass-btn">Critique</button>
                </div>
                <div id="editorOutput" class="editor__output">
                    <p class="text-muted italic">Spelling is instant. A page scan and a critique both run the local model, so give them a minute.</p>
                </div>
            </aside>
        </div>

    </div>
