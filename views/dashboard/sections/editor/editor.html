    <div class="editor dashboard-section hidden glass glass--frosted glass-card">
        <div class="editor__bar">
            <div class="flex-row-center gap-15">
                <h3 class="margin-0">Editor</h3>
                <!-- Not a control. Choosing what to open lives in the studio
                     rail's Story and Chapter menus; this only says what is
                     open, which is the one thing removing the pickers would
                     otherwise have left nowhere to read. -->
                <span id="editorWhere" class="editor__where">nothing open</span>
            </div>

            <div class="flex-row-center gap-15">
                <!--
                    Search the whole story. Ctrl+Shift+F does the same thing,
                    but a shortcut nobody is told about is a feature nobody
                    has: every other action in this app has a visible way in,
                    and this one shipped with none until it was noticed missing.

                    Here rather than in the studio rail because the rail's
                    buttons all switch SECTION, and this switches nothing - it
                    opens a panel over the chapter you are already reading.
                -->
                <button type="button" id="editorSearchBtn" class="editor__icon-btn"
                    title="Search this story (Ctrl+Shift+F)" aria-label="Search this story">
                    <ion-icon name="search-outline"></ion-icon>
                    <!-- The word stays HERE, where the feature has to be
                         discovered. Inside the panel it can go: by then the
                         writer has a search box in front of them and the icon
                         beside it is unambiguous. -->
                    <span>Search</span>
                </button>
                <span id="editorPageCount" class="editor__count" title="Standard manuscript pages, 250 words each">0 pages</span>
                <span id="editorWordCount" class="editor__count">0 words</span>
                <span id="editorSaveState" class="editor__state">saved</span>
                <!--
                    The button carries the state itself: a floppy disk when
                    there is something to save, a green tick when there is not.
                    The line beside it stays, because it says the things a
                    two-state icon cannot - autosaving, conflict, no story
                    folder, and the error text when a save fails.
                -->
                <button id="editorSaveBtn" class="glass glass-btn glass-btn--primary is-saved">
                    <ion-icon name="checkmark-circle" id="editorSaveIcon"></ion-icon>
                    <span id="editorSaveLabel">Saved</span>
                </button>

                <!--
                    Back up sits beside Save because it is the same kind of act
                    - getting the work somewhere safe - and this is where a
                    writer already looks to check that it is. It began in the
                    studio rail, among the tools, where it was both the wrong
                    category and genuinely hard to find.

                    Hidden until a GitHub account is connected. It stays
                    visible but marked unconfigured when an account exists and
                    a repository has not been chosen, so it can say what is
                    missing rather than vanish.
                -->
                <button type="button" id="backupBtn" class="glass glass-btn hidden"
                    title="Back up to GitHub">
                    <ion-icon name="cloud-upload-outline" id="backupIcon"></ion-icon>
                    <span id="backupLabel">Back up</span>
                </button>
            </div>
        </div>

        <div class="editor__body">
            <div class="editor__main">
                <!--
                    THE FORMATTING BAR.

                    Every button here is SEMANTIC — it says what a piece of text
                    is, not how it looks. There is deliberately no font, size,
                    colour or alignment, and that is not an omission:

                    - The manuscript is Markdown on disk. That is what Git backs
                      up and diffs, what MechanicsService anchors findings into
                      by character offset, and what the narrator reads. Storing
                      a font per paragraph costs all three.
                    - Standard manuscript format is one font, double-spaced,
                      left-aligned - the same assumption the 250-words-a-page
                      count rests on. A font picker invites the one thing that
                      marks a submission as amateur before it is read.

                    How the page LOOKS while writing is a separate question and
                    belongs in an appearance setting, where it changes the view
                    and never the file.

                    The bar exists because nobody knows Markdown. A novelist who
                    wants a word in italics will not guess `*like this*`, so
                    without this the feature may as well not be there.
                -->
                <div class="editor__format" role="toolbar" aria-label="Formatting">
                    <button type="button" class="editor__format-btn" data-format="bold"
                        title="Bold (Ctrl+B)" aria-label="Bold">
                        <span aria-hidden="true">B</span>
                    </button>
                    <button type="button" class="editor__format-btn editor__format-btn--em"
                        data-format="italic" title="Italic (Ctrl+I)" aria-label="Italic">
                        <span aria-hidden="true">I</span>
                    </button>
                    <button type="button" class="editor__format-btn editor__format-btn--strike"
                        data-format="strike" title="Strikethrough" aria-label="Strikethrough">
                        <span aria-hidden="true">S</span>
                    </button>

                    <div class="editor__format-divider" role="separator"></div>

                    <button type="button" class="editor__format-btn" data-format="heading"
                        title="Chapter heading" aria-label="Heading">
                        <span aria-hidden="true">H</span>
                    </button>
                    <button type="button" class="editor__format-btn" data-format="quote"
                        title="Block quote — letters, epigraphs, documents" aria-label="Block quote">
                        <ion-icon name="chatbox-ellipses-outline"></ion-icon>
                    </button>
                    <!-- The most useful button here. Every novel needs scene
                         breaks, the convention is not obvious, and left to
                         invent one a writer reaches for a row of hyphens that
                         means nothing to a typesetter or a parser. -->
                    <button type="button" class="editor__format-btn" data-format="scene"
                        title="Scene break" aria-label="Scene break">
                        <ion-icon name="ellipsis-horizontal"></ion-icon>
                    </button>

                    <div class="editor__format-divider" role="separator"></div>

                    <!--
                        The em dash, and the one button here that exists purely
                        because of the keyboard.

                        Everything else in this bar saves the writer from having
                        to know Markdown. This one saves them from hardware: a
                        laptop has no numeric keypad, so the Alt+0151 that
                        Windows documents for this character cannot be pressed
                        at all. The em dash is the interruption mark - the
                        punctuation dialogue leans on hardest - so the
                        alternative is two hyphens and a search-and-replace at
                        the end of the book.

                        The glyph IS the icon. No icon set draws this better
                        than the character does, and it shows the exact mark
                        that will land in the manuscript.
                    -->
                    <button type="button" class="editor__format-btn editor__format-btn--dash"
                        data-format="emdash" title="Em dash &mdash; (no keypad needed)"
                        aria-label="Insert em dash">
                        <span aria-hidden="true">&mdash;</span>
                    </button>
                </div>

                <!--
                    CodeMirror is created here by Surface.js, which also owns the
                    line numbers and the attributes that used to sit on the old
                    textarea: spellcheck stays on (the browser's checker is local,
                    instant and free), while autocorrect and autocapitalize stay
                    off because they mangle dialect, deliberate fragments and
                    invented names - all load-bearing in fiction. lang picks the
                    dictionary and is the same attribute `hyphens: auto` needs at
                    export time.
                -->
                <div id="editorSurface" class="editor__page"></div>

            </div>

            <!--
                THE DRAWER.

                Output only. Every control that used to be here - the lens and
                engine pickers, Spelling, Scan page, Critique - is in the studio
                rail's Review menu now, with the rest of the navigation.

                It is hidden until something has been found, and closes on the
                X, because 340px is a quarter of the writing width and an empty
                panel is not worth it. The editor opens it.
            -->
            <aside id="editorPanel" class="editor__panel" hidden>
                <div class="editor__panel-bar">
                    <h4 id="editorPanelTitle" class="editor__panel-title">Findings</h4>
                    <button type="button" id="editorPanelClose" class="editor__panel-close"
                        title="Close" aria-label="Close findings">
                        <ion-icon name="close"></ion-icon>
                    </button>
                </div>
                <div id="editorOutput" class="editor__output"></div>
            </aside>
        </div>

    </div>
