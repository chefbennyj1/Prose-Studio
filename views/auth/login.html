<div class="scene" aria-hidden="true">
  <div class="scene__blob scene__blob--1"></div>
  <div class="scene__blob scene__blob--2"></div>
  <div class="scene__blob scene__blob--3"></div>
</div>

<div class="auth-shell">
  <div class="auth-panel glass glass-card">

    <header class="auth-panel__head">
      <p class="glass-card__label">Prose Engine</p>
      <h1 class="glass-card__title" id="authHeading">Welcome back</h1>
    </header>

    <!-- Sign in -->
    <form id="loginForm" class="auth-form is-active" action="/authentication/login" method="POST" novalidate>
      <div class="auth-field">
        <label class="auth-field__label" for="login__email">Email</label>
        <div class="glass-input-wrap">
          <input type="email" id="login__email" name="email" class="glass-input"
                 autocomplete="username" required>
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-field__label" for="login__password">Password</label>
        <div class="glass-input-wrap">
          <input type="password" id="login__password" name="password" class="glass-input"
                 autocomplete="current-password" required>
        </div>
      </div>

      <div class="auth-form__actions">
        <button type="submit" id="loginSubmit" class="glass-btn glass-btn--primary glass-btn--lg">Sign in</button>
      </div>
    </form>

    <!-- Request access -->
    <form id="requestForm" class="auth-form" novalidate>
      <p class="auth-form__lede">
        Accounts are approved by an administrator. Send a request and you'll be
        let in once it's reviewed.
      </p>

      <div class="auth-field">
        <label class="auth-field__label" for="req__username">Full name</label>
        <div class="glass-input-wrap">
          <input type="text" id="req__username" name="username" class="glass-input"
                 autocomplete="name" required maxlength="50">
        </div>
        <p class="glass-field-error" id="req__username__err" hidden></p>
      </div>

      <div class="auth-field">
        <label class="auth-field__label" for="req__email">Email</label>
        <div class="glass-input-wrap">
          <input type="email" id="req__email" name="email" class="glass-input"
                 autocomplete="email" required>
        </div>
        <p class="glass-field-error" id="req__email__err" hidden></p>
      </div>

      <div class="auth-field">
        <label class="auth-field__label" for="req__password">Password</label>
        <div class="glass-input-wrap">
          <input type="password" id="req__password" name="password" class="glass-input"
                 autocomplete="new-password" required minlength="8" maxlength="128">
        </div>
        <p class="glass-field-error" id="req__password__err" hidden></p>
      </div>

      <div class="auth-field">
        <label class="auth-field__label" for="req__confirm">Confirm password</label>
        <div class="glass-input-wrap">
          <input type="password" id="req__confirm" name="confirmPassword" class="glass-input"
                 autocomplete="new-password" required minlength="8" maxlength="128">
        </div>
        <p class="glass-field-error" id="req__confirm__err" hidden></p>
      </div>

      <div class="auth-form__actions">
        <button type="submit" id="requestSubmit" class="glass-btn glass-btn--primary glass-btn--lg">
          Send request
        </button>
      </div>

      <p class="auth-form__note" id="requestNote" hidden></p>
    </form>

    <div class="auth-alt">
      <p class="auth-alt__text" data-alt-text>New here?</p>
      <button type="button" class="glass-btn glass-btn--ghost glass-btn--sm sign--up">Request access</button>
      <button type="button" class="glass-btn glass-btn--ghost glass-btn--sm sign--in" hidden>Back to sign in</button>
    </div>

  </div>
</div>

<!-- Error dialog -->
<div id="errorModal" class="glass-modal-backdrop auth-modal-backdrop" hidden>
  <div class="glass-modal glass" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle" class="glass-card__title">Access denied</h3>
    <p id="modalMessage" class="glass-card__body"></p>
    <div class="auth-form__actions">
      <button type="button" class="glass-btn glass-btn--ghost close-modal-btn">Understood</button>
    </div>
  </div>
</div>
